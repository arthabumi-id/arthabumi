<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Arthabumi</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arthabumi">
<meta name="theme-color" content="#FFFFFF">
<script>try{if(localStorage.getItem('ab3-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="preload" href="fonts/plus-jakarta-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* [v1.41] GAYA B (docs/PRD-redesain-b-v1.41.md) — palet sama dengan FCC. :root = terang (bawaan), :root.dark = gelap.
   Semua warna layar lewat token ini. Dokumen cetak (#print-area, laporan, Excel) TIDAK memakai token. */
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Fraunces';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/fraunces-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Fraunces';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/fraunces-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F5F1EA;--bg2:#FFFFFF;--bg3:#FBF8F3;--bg4:#EFE9DF;
  --border:#E6DFD3;--border2:#D6CCBC;
  --text:#1D1A16;--text2:#5B544B;--text3:#6F675D;
  --green:#0B6E5A;--red:#B42318;--blue:#2F5FA8;--amber:#8F5F00;--orange:#A84A0C;--purple:#6D4BC4;
  --accent:#A63A1F;--accent-ink:#FFFFFF;--accent-soft:#F8E4DC;--on:#FFFFFF;
  --ic-green:#DDF1EA;--ic-red:#F9E1DC;--ic-blue:#E3EAF6;--ic-amber:#F7E7C8;--ic-orange:#FBE6D5;--ic-purple:#ECE6FA;
  --bd-green:#B6DDD0;--bd-red:#F1C6BC;--bd-blue:#CCD9EE;--bd-amber:#EAD3A6;--bd-orange:#F2CDB0;--bd-purple:#D8CCF3;
  --hero:#FBEDE7;--hero-bd:#F0CFC2;--track:#EFE9DF;
  --shadow:0 1px 2px rgba(29,26,22,.05),0 4px 14px rgba(29,26,22,.05);--scrim:rgba(29,26,22,.42);
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
:root.dark{
  --bg:#14120F;--bg2:#1D1A16;--bg3:#241F1A;--bg4:#2D2720;
  --border:#2E2821;--border2:#3E362D;
  --text:#F5F1EA;--text2:#CFC6B8;--text3:#A39A8C;
  --green:#4FC9A6;--red:#F2836B;--blue:#86ADEB;--amber:#E9B45C;--orange:#F0A060;--purple:#B7A2F2;
  --accent:#F0876A;--accent-ink:#1D1A16;--accent-soft:#3A2019;--on:#14120F;
  --ic-green:#17302A;--ic-red:#3A1E18;--ic-blue:#1B2536;--ic-amber:#35280F;--ic-orange:#3A2614;--ic-purple:#28203B;
  --bd-green:#24493F;--bd-red:#5A2A22;--bd-blue:#2A3B57;--bd-amber:#54401C;--bd-orange:#573719;--bd-purple:#3E3260;
  --hero:linear-gradient(140deg,#3A2019,#1D1A16);--hero-bd:#F0876A40;--track:#2D2720;
  --shadow:none;--scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;-webkit-text-size-adjust:100%;overflow:hidden;font-feature-settings:'tnum' 1;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
*{-webkit-tap-highlight-color:transparent}
input,select,textarea{-webkit-appearance:none;appearance:none;font-family:inherit;font-size:16px;background:var(--bg2);color:var(--text)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
button{-webkit-appearance:none;font-family:inherit;color:var(--text)}
::placeholder{color:var(--text3);opacity:1}
#spl{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9999;transition:opacity .3s}
#spl.out{opacity:0;pointer-events:none}
.spl-logo{font-family:var(--font-display);color:var(--accent);font-size:2.1rem;font-weight:700;letter-spacing:-.5px}
.spl-sub{color:var(--text3);font-size:.8rem}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#hdr{background:var(--bg2);color:var(--text);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 0 14px;flex-shrink:0;height:calc(58px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.hdr-brand{display:flex;align-items:center;gap:10px;min-width:0}
.hdr-mark{width:34px;height:34px;flex-shrink:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:19px;font-weight:700}
.hdr-logo{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--text);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-line{display:flex;align-items:baseline;gap:6px;margin-top:1px;white-space:nowrap}
.hdr-sync{font-size:11px;font-weight:600}
.hdr-ver{font-size:10px;color:var(--text3);cursor:pointer}
.hdr-acts{display:flex;gap:6px;align-items:center;flex-shrink:0}
.hdr-btn{background:var(--bg2);border:1px solid var(--border);color:var(--text2);border-radius:10px;min-width:38px;height:38px;padding:0 9px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.hdr-btn:active{background:var(--bg4)}
.ic-sun{display:none}
:root.dark .ic-moon{display:none}
:root.dark .ic-sun{display:inline}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 20px}
#nav{background:var(--bg2);display:flex;flex-shrink:0;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .nav-btn{flex:1}
#nav-backdrop{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#nav-backdrop.show{opacity:1;pointer-events:auto}
#nav-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-radius:20px 20px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s cubic-bezier(.3,.8,.3,1);z-index:41;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
#nav-sheet.show{transform:translateY(0)}
.sheet-grab{width:38px;height:4px;background:var(--border2);border-radius:4px;margin:0 auto 12px}
.sheet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sheet-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;border-radius:12px;background:var(--bg3);border:1px solid var(--border);cursor:pointer;color:var(--text2)}
.sheet-item.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:9px 4px;min-width:0;flex-shrink:0;border:none;background:none;cursor:pointer;color:var(--text3)}
.nav-btn.on{color:var(--accent)}
.nav-dot{width:4px;height:4px;background:var(--accent);border-radius:50%;margin-top:1px}
#toast{position:fixed;bottom:85px;left:12px;right:12px;z-index:800;padding:11px 15px;border-radius:13px;color:var(--on);font-size:13px;font-weight:600;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.2);display:none;animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.t-ok{background:var(--green)}.t-err{background:var(--red)}.t-info{background:var(--blue)}
#overlay{position:fixed;inset:0;background:var(--scrim);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:14px;padding-top:56px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#overlay.show{display:flex}
.modal{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:20px;width:100%;max-width:480px;padding:18px;position:relative;margin-bottom:20px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal-x{position:absolute;top:13px;right:13px;background:var(--bg4);border:none;border-radius:10px;width:34px;height:34px;cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center}
.modal-title{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.3px;color:var(--text);margin-bottom:14px;padding-right:36px}
.card{background:var(--bg2);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--border);padding:13px;margin-bottom:9px}
.sub-card{background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:11px;margin-bottom:8px}
.sec-title{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.3px;color:var(--text);margin-bottom:11px}
.row{display:flex;align-items:center;justify-content:space-between}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.item-name{font-weight:600;font-size:13.5px;color:var(--text)}
.item-sub{font-size:11px;color:var(--text3);margin-top:1px}
.chip{background:var(--bg3);border-radius:9px;padding:7px 9px}
.chip-lbl{font-size:10px;color:var(--text3);margin-bottom:1px}
.chip-val{font-size:12px;font-weight:700;color:var(--text)}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}
.act-row{display:flex;gap:8px;margin-top:8px}
.fg{margin-bottom:11px}
.fl{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px}
.req{color:var(--red);margin-left:2px}
.fc{width:100%;border:1.5px solid var(--border2);border-radius:10px;padding:10px 12px;font-size:15px;background:var(--bg2);color:var(--text);outline:none;transition:border-color .15s}
.fc:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-p{background:var(--accent);color:var(--accent-ink)}
.btn-d{background:var(--red);color:var(--on)}
.btn-g{background:var(--bg4);color:var(--text2)}
.btn-o{background:var(--bg2);color:var(--accent);border:1.5px solid var(--accent)}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:9px}
.btn-w{width:100%}
/* [v1.36] Indikator proses */
#busybar{position:fixed;top:0;left:0;right:0;height:3px;z-index:9999;background:transparent;display:none;overflow:hidden}
#busybar.on{display:block}
#busybar i{display:block;height:100%;width:40%;background:var(--accent);border-radius:0 3px 3px 0;animation:bbslide 1.1s ease-in-out infinite}
@keyframes bbslide{0%{margin-left:-40%}100%{margin-left:100%}}
body.is-busy .btn-p,body.is-busy .btn-d{opacity:.5;pointer-events:none;filter:grayscale(.25)}
.sk{background:linear-gradient(90deg,var(--bg4) 25%,var(--bg3) 50%,var(--bg4) 75%);background-size:200% 100%;animation:skm 1.2s linear infinite;border-radius:9px}
@keyframes skm{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-row{height:58px;margin-bottom:8px}
.bdg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
.bdg-blue{background:var(--ic-blue);color:var(--blue)}
.bdg-green{background:var(--ic-green);color:var(--green)}
.bdg-yellow{background:var(--ic-amber);color:var(--amber)}
.bdg-red{background:var(--ic-red);color:var(--red)}
.bdg-gray{background:var(--bg4);color:var(--text2)}
.bdg-orange{background:var(--ic-orange);color:var(--orange)}
.bdg-purple{background:var(--ic-purple);color:var(--purple)}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.kpi{background:var(--bg2);border-radius:13px;padding:11px 13px;box-shadow:var(--shadow);border:1px solid var(--border)}
.kpi-lbl{font-size:9.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.kpi-val{font-size:13px;font-weight:700;color:var(--text);word-break:break-word}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer}
.tab-on{background:var(--accent);color:var(--accent-ink)}
.tab-off{background:var(--bg4);color:var(--text2)}
.info-box{background:var(--ic-blue);border:1px solid var(--bd-blue);border-radius:11px;padding:11px;font-size:11.5px;color:var(--blue);line-height:1.5;margin-bottom:11px}
.info-box ol{padding-left:15px;margin-top:5px}
.prog-bar{background:var(--track);border-radius:99px;height:6px;overflow:hidden;margin-top:4px}
.prog-fill{height:100%;border-radius:99px;transition:width .3s}
.num-hint{font-size:10px;color:var(--text3);margin-top:3px}
details>summary{color:inherit}
/* [v1.42] ikon garis, tab segmen, target sentuh */
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex-shrink:0;display:inline-block}
button:has(> .ic-b){min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.nav-ic{display:flex;align-items:center;justify-content:center;width:46px;height:28px;border-radius:14px;font-size:19px;transition:background .15s}
.nav-btn.on .nav-ic{background:var(--accent-soft)}
.nav-btn{gap:3px;min-height:56px}
.nav-dot{display:none}
.sheet-ic{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:20px}
.sheet-item{color:var(--text)}
.hdr-sync::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px}
#toast{align-items:center;justify-content:center;gap:8px}
#toast .ic{font-size:17px}
.row:has(> .sec-title + .tabs){flex-direction:column;align-items:stretch;gap:10px}
.row:has(> .sec-title + .tabs) > .sec-title{margin:0!important}
.tabs{gap:4px;padding:4px;background:var(--bg4);border-radius:12px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border-radius:17px;white-space:nowrap}
.tabs .tab{flex:1 0 auto;min-height:38px;padding:6px 12px;border-radius:9px;font-size:12.5px}
.tabs .tab-on{background:var(--bg2);color:var(--text);box-shadow:var(--shadow);font-weight:700}
:root.dark .tabs .tab-on{color:var(--accent)}
.tabs .tab-off{background:transparent;color:var(--text2)}
.btn{min-height:44px;gap:6px}
.btn-sm{min-height:36px}
.fc{min-height:46px}
textarea.fc{min-height:0}
.sec-title .ic{color:var(--accent)}
/* [v1.41] Dialog konfirmasi di dalam app (pengganti confirm()) */
#cfm{position:fixed;inset:0;z-index:900;background:var(--scrim);display:none;align-items:center;justify-content:center;padding:22px}
#cfm.show{display:flex}
.cfm-box{width:100%;max-width:400px;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:tin .15s ease}
.cfm-ic{width:46px;height:46px;border-radius:14px;background:var(--ic-amber);color:var(--amber);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.cfm-ic.d{background:var(--ic-red);color:var(--red)}
.cfm-t{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.3px;line-height:1.3;word-break:break-word}
.cfm-b{margin-top:8px;font-size:13.5px;line-height:1.55;color:var(--text2);white-space:pre-line}
.cfm-acts{display:flex;gap:10px;margin-top:18px}
.cfm-btn{flex:1;min-height:48px;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;border:1px solid var(--border2);background:var(--bg2);color:var(--text)}
.cfm-yes{border:none;background:var(--accent);color:var(--accent-ink)}
.cfm-yes.d{background:var(--red);color:var(--on)}
.cfm-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ── Print Area (hidden on screen) ─────────────────────────────────── */
#print-area{display:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1e293b;font-size:12px;line-height:1.5}
.pr-header{text-align:center;border-bottom:2px solid #1e293b;padding-bottom:12px;margin-bottom:16px}
.pr-title{font-size:22px;font-weight:800;letter-spacing:-.5px}
.pr-sub{font-size:13px;color:#475569;margin-top:3px}
.pr-date{font-size:10px;color:#94a3b8;margin-top:3px}
.pr-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.pr-kpi-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:9px 11px}
.pr-kpi-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:#94a3b8;margin-bottom:2px}
.pr-kpi-val{font-size:13px;font-weight:700}
.pr-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#64748b;border-bottom:1px solid #e2e8f0;padding-bottom:4px;margin-bottom:8px}
.pr-table{width:100%;border-collapse:collapse;font-size:11px}
.pr-table th{background:#f1f5f9;padding:5px 8px;text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;border:1px solid #e2e8f0;font-weight:700}
.pr-table td{padding:4px 8px;border:1px solid #e2e8f0;vertical-align:top}
.pr-table tfoot td{background:#f8fafc;font-size:11px}
.pr-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr-info-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
.pr-info-table td{padding:5px 9px;border:1px solid #e2e8f0}
.pr-info-lbl{background:#f8fafc;font-weight:600;font-size:10px;color:#475569;width:130px}
.pr-two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media print{
  #spl,#app,#toast,#overlay{display:none!important}
  #print-area{display:block!important;padding:0}
  html,body{height:auto!important;overflow:auto!important;background:#fff!important}
  @page{margin:15mm}
}
</style>
</head>
<body>
<div id="spl">
  <div class="spl-logo" id="spl-name">Arthabumi</div>
  <div class="spin"></div>
  <div class="spl-sub">Memuat aplikasi…</div>
</div>
<div id="busybar"><i></i></div>
<div id="app">
  <div id="hdr">
    <div class="hdr-brand">
      <div class="hdr-mark" aria-hidden="true">A</div>
      <div style="min-width:0">
        <div class="hdr-logo" id="hdr-name">Arthabumi</div>
        <div class="hdr-line"><span class="hdr-sync" id="sync-badge">Lokal</span><span id="hdr-ver" class="hdr-ver" onclick="openSettings()" title="Lihat changelog">v1.41</span></div>
      </div>

// [v1.38] token keamanan — ikut di setiap request (kosong = backend belum dikunci)
function _tokQ(tok){const t=(tok===undefined?S.apiToken:tok)||'';return t?'&token='+encodeURIComponent(t):'';}
async function gsFetch(url,tok){
  const ctrl=new AbortController();
  const tid=setTimeout(()=>ctrl.abort(),30000); // 30 detik — GAS cold start bisa 20-25 detik
  try{
    const r=await fetch(url+'?action=getAllData'+_tokQ(tok)+'&t='+Date.now(),{redirect:'follow',cache:'no-cache',signal:ctrl.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();if(!j.ok)throw new Error(j.error||'GSheet error');return j.data;
  }finally{clearTimeout(tid);}
}
async function gsWrite(url,action,data){
  const ps=JSON.stringify(data);
  if(ps.length>50000)throw new Error('Data terlalu besar (>50KB)');
  const ctrl=new AbortController();
  const tid=setTimeout(()=>ctrl.abort(),45000); // 45 detik — GAS bisa cold-start lama
  try{
    const r=await fetch(url+'?action='+action+'&payload='+encodeURIComponent(ps)+_tokQ()+'&t='+Date.now(),{redirect:'follow',cache:'no-cache',signal:ctrl.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    let j;try{j=await r.json();}catch{throw new Error('Response bukan JSON');}
    if(!j.ok)throw new Error(j.error||'Apps Script error');return j.data;
  }finally{clearTimeout(tid);}
}

// POST ke Apps Script (untuk payload besar spt foto — GET dibatasi ±50KB).
// Content-Type text/plain = "simple request", tidak kena preflight CORS.
async function gsPost(action,data){
  if(!S.webAppUrl)throw new Error('URL GSheet belum diatur');
  setBusy(true,true);
  const ctrl=new AbortController();
  const tid=setTimeout(()=>ctrl.abort(),90000); // foto + Drive bisa lama
  try{
    const r=await fetch(S.webAppUrl,{method:'POST',redirect:'follow',cache:'no-cache',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,data,token:S.apiToken||''}),signal:ctrl.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    let j;try{j=await r.json();}catch{throw new Error('Response bukan JSON');}
    if(!j.ok)throw new Error(j.error||'Apps Script error');return j.data;
  }finally{clearTimeout(tid);setBusy(false,true);}
}
// Kompres gambar di browser (canvas → JPEG) sebelum upload. Return base64 tanpa prefix.
function compressImage(file,maxW=1280,quality=0.72){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(url);
      try{
        const scale=Math.min(1,maxW/img.width);
        const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        res(cv.toDataURL('image/jpeg',quality).split(',')[1]);
      }catch(e){rej(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Gagal membaca gambar'));};
    img.src=url;
  });
}
// Merge GSheet array into local array.
// Strategy: GSheet is source of truth. Local entries without ID prefix "BLI-GS-" / "ABN-GS-" etc.
// are considered unsynced (written locally but not yet confirmed by GSheet).
// We keep them if GSheet doesn't have them yet, drop them once they appear in GSheet.
function _mergeArr(local, remote, idPrefix, keyFn, localOnlyFn){
  if(!remote||!remote.length) return local||[];
  const remoteIds=new Set(remote.map(x=>x.id));
  const remoteKeys=keyFn?new Set(remote.map(keyFn)):null;
  const localOnly=(local||[]).filter(x=>{
    // localOnlyFn (opsional): penanda eksplisit item belum-sync (mis. x.pending)
    if(localOnlyFn){ if(!localOnlyFn(x)) return false; }
    else if(!x.id||x.id.startsWith(idPrefix)) return false;
    if(remoteIds.has(x.id)) return false;
    if(remoteKeys&&remoteKeys.has(keyFn(x))) return false; // content-match → already synced
    return true;
  });
  return [...remote,...localOnly];
}
function applyGS(d){
  if(!d)return;
  if(_cfmOpen){_cfmHold=d;return;}   // [v1.41] tahan selama dialog konfirmasi terbuka
  // Master tables: always overwrite (no local-only entries for these)
  if(d.projects){S.projects=d.projects;ss(KS.p,d.projects);}
  if(d.karyawan){S.karyawan=d.karyawan;ss(KS.kr,d.karyawan);}
  if(d.barang){S.masterBarang=d.barang;ss(KS.brg,d.barang);}
  if(d.toko){S.masterToko=d.toko;ss(KS.toko,d.toko);}
  if(d.rab){S.rab=d.rab;ss(KS.rab,d.rab);}
  if(d.subkon){S.masterSubkon=d.subkon;ss(KS.sk,d.subkon);}
  // Log tables: merge — keep local-only unsynced entries until GSheet confirms them
  if(d.pembelian){const m=_mergeArr(S.pembelian,d.pembelian,'BLI-GS-',x=>`${x.tgl}|${x.kodeProj}|${x.namaBarang}`,x=>x.pending===true);S.pembelian=m;ss(KS.beli,m);}
  if(d.logAbsensi){const m=_mergeArr(S.logAbsensi,d.logAbsensi,'ABS-GS-',x=>`${x.tgl}|${x.idKaryawan}|${x.kodeProj}`,x=>x.pending===true);S.logAbsensi=m;ss(KS.abs,m);}
  if(d.logKasbon){const m=_mergeArr(S.logKasbon,d.logKasbon,'KSB-GS-',x=>`${x.tgl}|${x.idKaryawan}|${x.tipe}|${x.nominal}`,x=>x.pending===true);S.logKasbon=m;ss(KS.ksb,m);}
  if(d.logPembayaran){const m=_mergeArr(S.logPembayaran,d.logPembayaran,'PAY-GS-',x=>`${x.tgl}|${x.kodeProj}|${x.nominal}`,x=>x.pending===true);S.logPembayaran=m;ss(KS.bayar,m);}
  if(d.logSubkon){const m=_mergeArr(S.logSubkon,d.logSubkon,'LSK-GS-',x=>`${x.tgl}|${x.idSubkon}|${x.kodeProj}`,x=>x.pending===true);S.logSubkon=m;ss(KS.lsk,m);}
  if(d.bayarSubkonFCC){ // [v1.40] riwayat bayar subkon yang dicatat dari FCC (sheet LOG BAYAR SUBKON) — ganti entri fcc lama
    const r=S.riwayatBayarSubkon||{};
    Object.keys(r).forEach(k=>{r[k]=(r[k]||[]).filter(x=>!x.fcc);if(!r[k].length)delete r[k];});
    d.bayarSubkonFCC.forEach(b=>{(r[b.idLog]=r[b.idLog]||[]).push({tgl:b.tgl,nominal:b.nominal,fcc:true});});
    Object.keys(r).forEach(k=>r[k].sort((a,b)=>String(a.tgl||'').localeCompare(String(b.tgl||''))));
    S.riwayatBayarSubkon=r;ss(KS.rbsk,r);
  }
  S.lastSync=new Date();S.syncError=null;updateSyncBadge();
}
async function doFetch(url){
  const u=url||S.webAppUrl;if(!u)return;S.syncing=true;updateSyncBadge();setBusy(true,false);
  try{const d=await gsFetch(u);applyGS(d);}
  catch(e){
    const msg=e.name==='AbortError'?'GSheet lambat/timeout — data lokal dipakai':('GSheet: '+e.message);
    S.syncError=msg;showToast(''+msg,'err');
  }
  finally{
    const wasFirst=S._firstLoad;S.syncing=false;S._firstLoad=false;
    updateSyncBadge();setBusy(false,false);
    // Hanya render ulang saat muat pertama (skeleton → data). Polling TIDAK render ulang,
    // supaya form yang sedang diisi tidak terhapus di tengah jalan.
    if(wasFirst&&S.page)go(S.page);
  }
}
async function doSync(action,payload){
  if(!S.webAppUrl)return;S.syncing=true;S.syncError=null;updateSyncBadge();setBusy(true,true);
  showToast('Menyimpan ke GSheet…','info');
  try{const d=await gsWrite(S.webAppUrl,action,payload);applyGS(d);showToast('GSheet berhasil diupdate!');go(S.page);}
  catch(e){
    const msg=e.name==='AbortError'?'GSheet timeout — data disimpan lokal, retry otomatis':e.message;
    S.syncError=msg;S.retryQ.push({action,payload,retries:0});showToast(''+msg,'err');
  }
  finally{S.syncing=false;updateSyncBadge();setBusy(false,true);}
}
function updateSyncBadge(){
  const el=document.getElementById('sync-badge');if(!el)return;
  if(!S.webAppUrl){el.textContent='Lokal';el.style.color='var(--text2)';}
  else if(S.syncing){el.textContent='Sync…';el.style.color='var(--blue)';}
  else if(S.syncError){el.textContent='Gagal';el.style.color='var(--red)';}
  else if(S.lastSync){el.textContent=''+S.lastSync.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+(S.countdown>0?' ·'+S.countdown+'d':'');el.style.color='var(--green)';}
  else{el.textContent='GSheet';el.style.color='var(--amber)';}
  const rb=document.getElementById('retry-badge');if(rb){rb.style.display=S.retryQ.length>0?'inline':'none';rb.textContent='Antre '+S.retryQ.length;}
  const sb=document.getElementById('btn-sync');if(sb)sb.style.display=S.webAppUrl?'inline-flex':'none';
}
function manualSync(){S.countdown=S.pollInterval;doFetch();}
let countdownTimer=null;
function startPoll(){
  if(countdownTimer)clearInterval(countdownTimer);
  if(!S.webAppUrl||!S.pollInterval||S.pollInterval<=0)return;
  S.countdown=S.pollInterval;
  countdownTimer=setInterval(()=>{S.countdown--;updateSyncBadge();if(S.countdown<=0){S.countdown=S.pollInterval;if(!S.syncing)doFetch();}},1000);
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&S.webAppUrl&&!S.syncing){
    const gap=S.lastSync?(Date.now()-S.lastSync.getTime()):Infinity;
    if(gap>30000)doFetch();
  }
});
setInterval(async()=>{
  if(!S.webAppUrl||S.retryQ.length===0||S.syncing)return;
  const item=S.retryQ[0];if(!item)return;
  if(item.retries>=3){S.retryQ.shift();showToast('Retry gagal 3x','err');return;}
  S.syncing=true;setBusy(true,false);
  try{const d=await gsWrite(S.webAppUrl,item.action,item.payload);applyGS(d);S.retryQ.shift();showToast('Retry OK');}
  catch{item.retries++;}
  finally{S.syncing=false;updateSyncBadge();setBusy(false,false);}
},30000);

// ── FEATURE 4: Date Filter [v1.11]
const filterByDate=(items,mode,fromDate,toDate)=>{
  if(!mode||mode==='all')return items;
  const today_str=today();
  const t=new Date(today_str);
  let from,to;
  if(mode==='today'){from=to=today_str;}
  else if(mode==='yesterday'){const y=new Date(t);y.setDate(y.getDate()-1);const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');from=to=ys;}
  else if(mode==='thisweek'){
    const day=t.getDay();const diff=t.getDate()-day+(day===0?-6:1);
    const start=new Date(t.setDate(diff));from=start.getFullYear()+'-'+String(start.getMonth()+1).padStart(2,'0')+'-'+String(start.getDate()).padStart(2,'0');
    to=today_str;
  }
  else if(mode==='thismonth'){
    from=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-01';
    to=today_str;
  }
  else if(mode==='custom'){
    from=fromDate;to=toDate;
  }
  if(!from&&!to)return items; // custom: satu sisi kosong = rentang terbuka
  return items.filter(x=>{const d=(x.tgl||'').substring(0,10);return (!from||d>=from)&&(!to||d<=to);});
};
// ── FEATURE 1: Cashflow Calculation [v1.11]
// Helper: hitung semua komponen kasbon untuk satu proyek
// - ambil  = total kasbon AMBIL yang tercatat untuk proyek ini
// calcKasbonForProj v2 — model baru:
// - POTONG: user secara eksplisit pilih proyek mana yang menanggung kasbon ini
// - BONUS : bonus karyawan untuk proyek ini
// - Hutang karyawan (global) dipisah di getWorkerKasbonDetail
const calcKasbonForProj=(kode)=>{
  const potong=S.logKasbon.filter(x=>x.kodeProj===kode&&x.tipe==='POTONG')
    .reduce((s,x)=>s+(Number(x.nominal)||0),0);
  const bonus=S.logKasbon.filter(x=>x.kodeProj===kode&&x.tipe==='BONUS')
    .reduce((s,x)=>s+(Number(x.nominal)||0),0);
  return{potong,bonus};
};
// Helper: kasbon per-worker, breakdown per proyek
// Returns {byProj:[{kodeProj,projNama,ambil}], totalAmbil, totalPotong, hutang}
const getWorkerKasbonDetail=(idKaryawan)=>{
  const projMap={};
  S.logKasbon.filter(x=>x.idKaryawan===idKaryawan&&x.tipe==='AMBIL').forEach(x=>{
    const kp=x.kodeProj||'__global__';
    projMap[kp]=(projMap[kp]||0)+(Number(x.nominal)||0);
  });
  const totalAmbil=Object.values(projMap).reduce((s,v)=>s+v,0);
  const totalPotong=S.logKasbon.filter(x=>x.idKaryawan===idKaryawan&&x.tipe==='POTONG').reduce((s,x)=>s+(Number(x.nominal)||0),0);
  const hutang=Math.max(0,totalAmbil-totalPotong);
  const byProj=Object.entries(projMap).map(([kodeProj,ambil])=>({
    kodeProj,
    projNama:kodeProj==='__global__'?'Tidak terkait proyek':S.projects.find(p=>p.kode===kodeProj)?.nama||kodeProj,
    ambil
  })).sort((a,b)=>b.ambil-a.ambil);
  return{byProj,totalAmbil,totalPotong,hutang};
};
const calcCashflow=(kodeProj)=>{
  const pembayaran=S.logPembayaran.filter(x=>x.kodeProj===kodeProj).reduce((s,x)=>s+(Number(x.nominal)||0),0);
  const pembelian=S.pembelian.filter(b=>b.kodeProj===kodeProj&&b.status!=='ASET').reduce((s,b)=>s+calcTotal(b),0);
  const upah=S.logAbsensi.filter(a=>a.kodeProj===kodeProj).reduce((s,a)=>s+(Number(a.upahHariIni)||0),0);
  const subkon=S.logSubkon.filter(ls=>ls.kodeProj===kodeProj).reduce((s,ls)=>s+(Number(ls.nilaiKontrak)||0),0);
  const kb=calcKasbonForProj(kodeProj);
  // biaya = upah_gross + mat + subkon + bonus
  // (net_upah + kasbon_jadi_biaya = gross, potong cancel)
  return pembayaran-(pembelian+upah+subkon+kb.bonus);
};

function pgPiutang(){
  const projs=S.projects
    .map(p=>{
      const bayar=S.logPembayaran.filter(x=>x.kodeProj===p.kode).reduce((s,x)=>s+(Number(x.nominal)||0),0);
      const nk=vSum(p).final;
      const piutang=nk-bayar;
      return{...p,bayar,piutang,nk};
    })
    .filter(p=>p.piutang>0)
    .sort((a,b)=>b.piutang-a.piutang);

  if(!projs.length)return`<div style="text-align:center;padding:50px 20px">
    <div style="font-size:36px;margin-bottom:8px">${ic('sparkles')}</div>
    <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px">Tidak ada piutang!</div>
    <div style="font-size:13px;color:var(--text3)">Semua proyek sudah lunas.</div></div>`;

  const totalPiutang=projs.reduce((s,p)=>s+p.piutang,0);
  const totalKontrak=projs.reduce((s,p)=>s+(Number(p.nk)||0),0);
  const totalBayar=projs.reduce((s,p)=>s+p.bayar,0);

  const cards=projs.map(p=>{
    const pct=p.nk>0?Math.round(p.bayar/p.nk*100):0;
    const isHigh=p.piutang>=(Number(p.nk)||0)*0.5;
    return `<div class="card" style="border-left:3px solid ${isHigh?'var(--red)':'var(--orange)'}">
      <div class="row" style="margin-bottom:8px">
        <div style="flex:1;min-width:0">
          <div class="item-name">${esc(p.nama)}</div>
          <div class="item-sub">${esc(p.jenis)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          ${bdg(p.status)}
          <button class="btn btn-o btn-sm" style="font-size:11px;padding:5px 10px" onclick="openRekapProyek('${esc(p.kode)}')">${ic('clipboard','b')}</button>
        </div>
      </div>
      <div class="g3">
        <div class="chip"><div class="chip-lbl">Kontrak</div><div class="chip-val">${fRp(p.nk)}</div></div>
        <div class="chip" style="background:var(--ic-green)"><div class="chip-lbl">Sudah Bayar (${pct}%)</div><div class="chip-val" style="color:var(--green)">${fRp(p.bayar)}</div></div>
        <div class="chip" style="background:var(--ic-orange)"><div class="chip-lbl">Sisa Tagih</div><div class="chip-val" style="color:var(--red);font-size:13px">${fRp(p.piutang)}</div></div>
      </div>
      <div style="margin-top:8px">
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:var(--green)"></div></div>
        <div style="font-size:10px;color:var(--text3);margin-top:3px">${pct}% terbayar</div>
      </div>
    </div>`;
  }).join('');

  return `<div class="kpi-grid" style="margin-bottom:12px">
    <div class="kpi" style="background:var(--ic-orange);border:1px solid var(--ic-orange)"><div class="kpi-lbl">Total Piutang</div><div class="kpi-val" style="color:var(--red)">${fRp(totalPiutang)}</div></div>
    <div class="kpi"><div class="kpi-lbl">${projs.length} proyek belum lunas</div><div class="kpi-val" style="font-size:13px;color:var(--text2)">${fRp(totalBayar)} / ${fRp(totalKontrak)}</div></div>
  </div>${cards}`;
}

// Hitung total kerja tambah/kurang & nilai final proyek
function vSum(p){
  const v=(p&&p.variasi)||[];let t=0,k=0;
  v.forEach(x=>{const n=Number(x.nominal)||0;if(x.jenis==='kurang')k+=n;else t+=n;});
  return{tambah:t,kurang:k,n:v.length,final:(Number(p.nilaiKontrak)||0)+t-k};
}
function _projPayload(p){return{kode:p.kode,nama:p.nama,jenis:p.jenis,status:p.status,nilaiKontrak:p.nilaiKontrak,tglMulai:p.tglMulai||'',catatan:p.catatan||'',progress:p.progress||0,variasi:p.variasi||[]};}
function saveProject(isEdit){
  const kode=document.getElementById('p-kode').value.trim();
  const nama=document.getElementById('p-nama').value.trim();
  const kontrak=getNum('p-kontrak');
  const progress=Math.min(100,Math.max(0,parseInt(document.getElementById('p-progress').value)||0));
  if(!kode||!nama||!kontrak){showToast('Lengkapi field wajib','err');return;}
  const _ei=isEdit?Number(document.getElementById('p-idx').value):-1;
  const existingCatatan=isEdit?(S.projects[_ei]?.catatan||''):'';
  const existingVariasi=isEdit?(S.projects[_ei]?.variasi||[]):[];
  const d={kode,nama,jenis:document.getElementById('p-jenis').value,status:document.getElementById('p-sts').value,nilaiKontrak:kontrak,tglMulai:document.getElementById('p-tgl').value,catatan:existingCatatan,progress,variasi:existingVariasi};
  if(isEdit){const i=Number(document.getElementById('p-idx').value);S.projects[i]=d;}else S.projects.push(d);
  ss(KS.p,S.projects);closeModal();go('project');
  showToast(isEdit?'Proyek diperbarui':'Proyek ditambahkan');
  doSync(isEdit?'updateProject':'addProject',d);
}
async function delProject(kode){
  const nama=S.projects.find(p=>p.kode===kode)?.nama||kode;
  if(!(await askConfirm('Hapus proyek "'+nama+'"?',{ok:'Hapus',danger:1})))return;
  S.projects=S.projects.filter(p=>p.kode!==kode);ss(KS.p,S.projects);go('project');
  showToast('Dihapus');doSync('deleteProject',{kode});
}

// ── DASHBOARD HUTANG ──────────────────────────────────────────────────
function pgHutang(){
  // ── 1. Hutang Upah per Proyek ────────────────────────────────────────
  const upahByProj={};
  S.logAbsensi.filter(a=>a.statusBayar==='Belum Dibayar').forEach(a=>{
    if(!upahByProj[a.kodeProj])upahByProj[a.kodeProj]={karyawan:{},total:0};
    if(!upahByProj[a.kodeProj].karyawan[a.idKaryawan])
      upahByProj[a.kodeProj].karyawan[a.idKaryawan]={nama:a.nama||a.idKaryawan,total:0,hari:0};
    upahByProj[a.kodeProj].karyawan[a.idKaryawan].total+=(Number(a.upahHariIni)||0);
    upahByProj[a.kodeProj].karyawan[a.idKaryawan].hari++;
    upahByProj[a.kodeProj].total+=(Number(a.upahHariIni)||0);
  });
  const totalHutangUpah=Object.values(upahByProj).reduce((s,x)=>s+x.total,0);

  // ── 2. Hutang Subkon ─────────────────────────────────────────────────
  const subkonBelum=S.logSubkon.filter(ls=>ls.statusBayar==='Belum Dibayar');
  const totalHutangSubkon=subkonBelum.reduce((s,ls)=>s+(Number(ls.nilaiKontrak)||0)-(Number(ls.nominalBayar)||0),0);

  const grandTotal=totalHutangUpah+totalHutangSubkon;

  if(grandTotal===0&&subkonBelum.length===0&&totalHutangUpah===0)
    return`<div style="text-align:center;padding:50px 20px">
      <div style="font-size:36px;margin-bottom:8px">${ic('check-circle')}</div>
      <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px">Tidak ada hutang!</div>
      <div style="font-size:13px;color:var(--text3)">Semua upah dan subkon sudah dibayar.</div></div>`;

  // KPI
  const kpi=`<div class="kpi-grid" style="margin-bottom:14px">
    <div class="kpi" style="background:var(--ic-red);border:1px solid var(--bd-red)"><div class="kpi-lbl">Total Hutang</div><div class="kpi-val" style="color:var(--red)">${fRp(grandTotal)}</div></div>
    <div class="kpi"><div class="kpi-lbl">Hutang Upah</div><div class="kpi-val" style="color:var(--orange)">${fRp(totalHutangUpah)}</div></div>
    <div class="kpi"><div class="kpi-lbl">Hutang Subkon</div><div class="kpi-val" style="color:var(--purple)">${fRp(totalHutangSubkon)}</div></div>
    <div class="kpi"><div class="kpi-lbl">${Object.keys(upahByProj).length} proyek · ${subkonBelum.length} subkon</div><div class="kpi-val" style="font-size:11px;color:var(--text3)">belum lunas</div></div>
  </div>`;

  // Bagian Upah
  let upahSection='';
  if(totalHutangUpah>0){
    const projCards=Object.entries(upahByProj)
      .sort((a,b)=>b[1].total-a[1].total)
      .map(([kodeProj,data])=>{
        const proj=S.projects.find(p=>p.kode===kodeProj);
        const namaProj=proj?proj.nama:kodeProj;
        const krList=Object.values(data.karyawan).sort((a,b)=>b.total-a.total);
        return`<div class="card" style="border-left:3px solid var(--orange);margin-bottom:8px">
          <div class="row" style="margin-bottom:8px">
            <div><div class="item-name">${esc(namaProj)}</div><div class="item-sub">${esc(kodeProj)}</div></div>
            <div style="text-align:right">
              <div style="font-size:15px;font-weight:800;color:var(--orange)">${fRp(data.total)}</div>
              <button class="btn btn-o btn-sm" style="font-size:10px;padding:3px 8px;margin-top:3px" onclick="go('closing')">Bayar →</button>
            </div>
          </div>
          <div style="background:var(--ic-orange);border-radius:8px;padding:8px 10px">
            ${krList.map(kr=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--ic-orange);font-size:12px">
              <span style="color:var(--amber)">${esc(kr.nama)} <span style="color:var(--amber);font-size:11px">${kr.hari} hari</span></span>
              <span style="font-weight:700;color:var(--orange)">${fRp(kr.total)}</span>
            </div>`).join('')}
          </div>
        </div>`;
      }).join('');
    upahSection=`<div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.5px;margin-bottom:8px">${ic('user')} HUTANG UPAH KARYAWAN</div>${projCards}`;
  }

  // Bagian Subkon

        return`<div class="card" style="border-left:3px solid var(--purple);margin-bottom:8px">
          <div class="row">

  }

  return kpi+upahSection+subkonSection;
}

  const upahTotal=S.logAbsensi.filter(a=>a.kodeProj===kode).reduce((s,a)=>s+(Number(a.upahHariIni)||0),0);
  const upahSudah=S.logAbsensi.filter(a=>a.kodeProj===kode&&a.statusBayar==='Sudah Dibayar').reduce((s,a)=>s+(Number(a.upahHariIni)||0),0);
  const upahBelum=S.logAbsensi.filter(a=>a.kodeProj===kode&&a.statusBayar==='Belum Dibayar').reduce((s,a)=>s+(Number(a.upahHariIni)||0),0);
  const subkonBiaya=S.logSubkon.filter(ls=>ls.kodeProj===kode).reduce((s,ls)=>s+(Number(ls.nilaiKontrak)||0),0);
  const kb=calcKasbonForProj(kode);
  const upahNet=upahTotal-kb.potong; // cash dibayar ke tukang
  // biaya = upah_gross + mat + subkon + bonus
  // (net_upah + kasbon_jadi_biaya = gross; potong cancel)
  const totalBiaya=matBiaya+upahTotal+subkonBiaya+kb.bonus;
  // Pembayaran klien
  const bayarRows=S.logPembayaran.filter(x=>x.kodeProj===kode).sort((a,b)=>b.tgl.localeCompare(a.tgl));
  const bayarTotal=bayarRows.reduce((s,x)=>s+(Number(x.nominal)||0),0);

  const margin=nilaiFinal>0?(laba/nilaiFinal*100):0;
  // RAB
  const rab=S.rab.find(r=>r.kodeProj===kode);
  const rabT=rab?(rab.material||0)+(rab.upah||0)+(rab.subkon||0)+(rab.overhead||0):0;
  const pctRAB=rabT>0?Math.min(100,Math.round(totalBiaya/rabT*100)):0;

  const upahMap={};

    upahMap[a.idKaryawan].total+=(Number(a.upahHariIni)||0);
    upahMap[a.idKaryawan].hari+=(a.status==='Setengah Hari'?0.5:(a.status==='Hadir'?1:0)); // [v1.36] samakan dgn fHari()

  const upahBelumList=Object.values(upahMap).sort((a,b)=>b.total-a.total);

    <div class="g2" style="margin-bottom:12px">

    ${upahBelum>0&&upahBelum>=(Number(p.nilaiKontrak)||0)*0.1?`<div style="background:var(--ic-amber);border:1px solid var(--ic-amber);border-radius:11px;padding:10px;margin-bottom:12px;font-size:12px;color:var(--amber)">${ic('alert')} <strong>Upah menumpuk</strong> – ${fRp(upahBelum)} belum dibayar. Segera lakukan pembayaran.</div>`:''}
    ${rabT>0&&totalBiaya>rabT*0.9?`<div style="background:var(--ic-red);border:1px solid var(--bd-red);border-radius:11px;padding:10px;margin-bottom:12px;font-size:12px;color:var(--red)">${ic('alert')} <strong>Biaya mendekati RAB</strong> – Sudah ${Math.round(totalBiaya/rabT*100)}% dari RAB ${fRp(rabT)}. Perhatikan pengeluaran selanjutnya.</div>`:''}

function _beliFiltered(){
  const dateMode=S.tab.beliDateMode||'all';
  const fromD=S.tab.beliDateFrom||'';
  const toD=S.tab.beliDateTo||'';
  const q=(S.beliLogQ||'').toLowerCase().trim();
  const tokoF=(S.beliTokoFilter||'').trim().toLowerCase();
  let filtered=[...S.pembelian].sort((a,b)=>String(b.tgl||'').localeCompare(String(a.tgl||'')));
  if(S.beliFilter) filtered=filtered.filter(b=>b.kodeProj===S.beliFilter);
  if(tokoF)        filtered=filtered.filter(b=>(b.toko||'').trim().toLowerCase()===tokoF);
  filtered=filterByDate(filtered,dateMode,fromD,toD);
  if(q) filtered=filtered.filter(b=>(b.namaBarang||'').toLowerCase().includes(q));
  return filtered;
}
function _beliItemsList(){
  const view=S.tab.beliView||'date';
  const filtered=_beliFiltered();
  if(!filtered.length) return`<div class="empty">Tidak ada data yang sesuai filter</div>`;
  const grandTotal=filtered.reduce((s,b)=>s+calcTotal(b),0);
  const summary=`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:var(--ic-green);border:1px solid var(--bd-green);border-radius:10px;margin-bottom:10px">
    <span style="font-size:12px;color:var(--green);font-weight:600">${filtered.length} item sesuai filter</span>
    <span style="font-weight:800;color:var(--green);font-size:14px">${fRp(grandTotal)}</span>
  </div>`;
  if(view==='toko')return summary+_beliGroupToko(filtered);
  return summary+_beliGroupTanggal(filtered);
}
function _beliGroupTanggal(filtered){
  const MAX=250;
  const capped=filtered.slice(0,MAX);
  const note=filtered.length>MAX?`<div class="empty" style="padding:10px">Menampilkan ${MAX} item terbaru — persempit filter untuk melihat sisanya</div>`:'';
  const closed=S.tab.beliClosedDT||[];
  const groups={};const order=[];
  capped.forEach(b=>{
    const k=String(b.tgl||'')||'(Tanpa Tanggal)';
    if(!groups[k]){groups[k]={items:[],total:0,toko:{},tokoOrder:[]};order.push(k);}
    const g=groups[k];
    g.items.push(b);
    g.total+=calcTotal(b);
    const tk=(b.toko||'').trim()||'(Tanpa Toko)';
    if(!g.toko[tk]){g.toko[tk]={items:[],total:0};g.tokoOrder.push(tk);}
    g.toko[tk].items.push(b);
    g.toko[tk].total+=calcTotal(b);
  });
  return order.map(tgl=>{
    const g=groups[tgl];
    const tokos=g.tokoOrder.slice().sort((x,y)=>{
      if(x==='(Tanpa Toko)')return 1;
      if(y==='(Tanpa Toko)')return -1;
      return x.localeCompare(y,'id');
    });
    const body=tokos.map(tk=>{
      const t=g.toko[tk];
      const key=tgl+'|'+tk;
      const isClosed=closed.indexOf(key)>=0;
      const detail=isClosed?'':`<div style="margin-top:5px">${t.items.map(b=>beliItemCard(b,false,true)).join('')}</div>`;
      return `<div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 11px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;cursor:pointer" data-k="${esc(key)}" onclick="toggleBeliDT(this.dataset.k)">
          <div style="min-width:0;flex:1">
            <span style="font-weight:700;font-size:12.5px">${isClosed?'▸':'▾'} ${ic('store')} ${esc(tk)}</span>
            <span style="font-size:11px;color:var(--text2);margin-left:6px">${t.items.length} item</span>
          </div>
          <span style="font-weight:700;color:var(--blue);font-size:12.5px;flex-shrink:0">${fRp(t.total)}</span>
        </div>
        ${detail}
      </div>`;
    }).join('');
    return `<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg4);border-radius:10px;margin-bottom:6px">
        <div>
          <span style="font-weight:700;font-size:13px">${ic('calendar')} ${tgl==='(Tanpa Tanggal)'?tgl:fDate(tgl)}</span>
          <span style="font-size:11px;color:var(--text2);margin-left:6px">${g.items.length} item · ${tokos.length} toko</span>
        </div>
        <span style="font-weight:700;color:var(--green);font-size:13px">${fRp(g.total)}</span>
      </div>
      ${body}
    </div>`;
  }).join('')+note;
}
function _beliGroupToko(filtered){
  const open=S.tab.beliOpenToko||[];
  const groups={};
  filtered.forEach(b=>{
    const k=(b.toko||'').trim()||'(Tanpa Toko)';
    if(!groups[k])groups[k]={items:[],total:0,last:''};
    groups[k].items.push(b);
    groups[k].total+=calcTotal(b);
    const t=String(b.tgl||''); if(t>groups[k].last)groups[k].last=t;
  });
  const sorted=Object.keys(groups).sort((a,b)=>groups[b].last.localeCompare(groups[a].last));
  return sorted.map(toko=>{
    const g=groups[toko];
    const isOpen=open.includes(toko);
    const detail=isOpen?`<div style="margin-top:6px">${g.items.map(b=>beliItemCard(b,false)).join('')}</div>`:'';
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg4);border-radius:10px;cursor:pointer" data-toko="${esc(toko)}" onclick="toggleBeliToko(this.dataset.toko)">

function beliCekHarga(){

function _cekHargaResults(){
  const q=(S.beliSearchQ||'').toLowerCase().trim();
  if(!q)return`<div class="empty" style="padding:30px 20px">Ketik nama barang untuk cek harga &amp; riwayat</div>`;
  if(!S.masterBarang.length)return`<div class="empty">Data master barang kosong.<br>Sync dulu untuk memuat data.</div>`;
  const items=S.masterBarang.filter(b=>b.nama.toLowerCase().includes(q));
  if(!items.length)return`<div class="empty">Barang "<strong>${esc(q)}</strong>" belum ada di database</div>`;
  const total=`<div style="font-size:11px;color:var(--text3);margin-bottom:8px">${items.length} item ditemukan${items.length>30?' · tampil 30 teratas':''}</div>`;
  const cards=items.slice(0,30).map(b=>{
    const hist=S.pembelian
      .filter(p=>p.namaBarang.toLowerCase()===b.nama.toLowerCase()&&Number(p.harga)>0)
      .sort((a,c)=>c.tgl.localeCompare(a.tgl))
      .slice(0,6);
    const prices=hist.map(h=>Number(h.harga));
    const minH=prices.length?Math.min(...prices):null;
    const maxH=prices.length?Math.max(...prices):null;
    const avgH=prices.length?Math.round(prices.reduce((s,v)=>s+v,0)/prices.length):null;
    const rangeBar=prices.length>1?`<div style="display:flex;gap:10px;margin:5px 0 6px;flex-wrap:wrap">
      <span style="font-size:11px;background:var(--ic-green);color:var(--green);padding:2px 8px;border-radius:20px">Min ${fRp(minH)}</span>
      <span style="font-size:11px;background:var(--ic-amber);color:var(--amber);padding:2px 8px;border-radius:20px">Avg ${fRp(avgH)}</span>
      <span style="font-size:11px;background:var(--ic-red);color:var(--red);padding:2px 8px;border-radius:20px">Max ${fRp(maxH)}</span>
    </div>`:prices.length===1?`<div style="margin-bottom:5px"></div>`:'';
    const histRows=hist.map(h=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--bg4);font-size:11.5px">
      <div><span style="color:var(--text2);font-weight:600">${fDate(h.tgl)}</span>${h.toko?` · <span style="color:var(--text2)">${esc(h.toko)}</span>`:''}</div>
      <div style="font-weight:700;color:var(--text)">${fRp(h.harga)} <span style="color:var(--text3);font-weight:400">/ ${esc(h.satuan||b.satuan||'pcs')}</span></div>
    </div>`).join('');
    return `<div class="card" style="margin-bottom:8px">
      <div class="row" style="margin-bottom:2px">
        <div style="flex:1;min-width:0">
          <div class="item-name">${esc(b.nama)}</div>
          <div class="item-sub">${esc(b.kategori||'')}${b.kategori&&b.satuan?' · ':''}${esc(b.satuan||'')}</div>
        </div>
        <div style="text-align:right;margin-left:10px;flex-shrink:0">
          <div style="font-size:16px;font-weight:800;color:var(--green)">${fRp(b.hargaTerakhir)}</div>
          <div style="font-size:10px;color:var(--text3)">harga terakhir</div>
        </div>
      </div>
      ${rangeBar}
      ${hist.length?`<div style="border-top:1px solid var(--bg4);padding-top:4px">${histRows}</div>`:'<div style="font-size:11px;color:var(--text3);margin-top:4px">Belum ada riwayat pembelian</div>'}
    </div>`;
  }).join('');
  return total+cards;
}

// ── Auto-isi harga dari Master Barang saat nama barang cocok [v1.34]
// Tidak menimpa harga yang sudah diketik manual (flag hargaAuto).
function beliAutoHarga(i,val){
  const it=S.formItems[i];if(!it)return;
  it.namaBarang=val;
  const nm=String(val||'').trim().toLowerCase();
  const hintEl=document.getElementById('bi-hint-'+i);
  if(!nm){it.hargaAuto=false;it.hargaInfo='';if(hintEl)hintEl.style.display='none';return;}
  const b=S.masterBarang.find(x=>String(x.nama||'').trim().toLowerCase()===nm);
  if(!b){if(hintEl)hintEl.style.display='none';return;}
  // Ikut bawa satuan & kategori supaya konsisten dgn katalog
  if(b.satuan)it.satuan=b.satuan;
  if(b.kategori)it.kategori=b.kategori;
  const h=Number(b.hargaTerakhir)||0;
  if(h<=0)return;
  // Harga manual (diketik sendiri) tidak diganggu
  if(Number(it.harga)>0&&!it.hargaAuto)return;
  it.harga=h;it.hargaAuto=true;
  it.hargaInfo=_beliHargaInfo(nm,h,b.satuan);
  const hrgEl=document.getElementById('bi-hrg-'+i);
  if(hrgEl){hrgEl.value=h.toLocaleString('id-ID');hrgEl.dataset.raw=h;}
  if(hintEl){hintEl.innerHTML=it.hargaInfo;hintEl.style.display='';}
}
// Bangun keterangan harga: terakhir + terendah sepanjang riwayat pembelian [v1.35]
function _beliHargaInfo(nm,h,satuan){
  const hist=S.pembelian.filter(p=>String(p.namaBarang||'').trim().toLowerCase()===nm&&Number(p.harga)>0);
  const last=[...hist].sort((a,c)=>String(c.tgl||'').localeCompare(String(a.tgl||'')))[0];
  let html=''+ic('sparkles')+' Harga terakhir <strong>'+fRp(h)+'</strong>'+(satuan?'/'+esc(satuan):'')
    +(last?' · '+fDate(last.tgl)+(last.toko?' · '+esc(last.toko):''):'');
  if(!hist.length)return html;
  const min=Math.min(...hist.map(p=>Number(p.harga)));
  const minRec=hist.filter(p=>Number(p.harga)===min)
    .sort((a,c)=>String(c.tgl||'').localeCompare(String(a.tgl||'')))[0];
  if(min<h){
    html+='<br><span style="color:var(--amber)">'+ic('trend-down')+' Terendah <strong>'+fRp(min)+'</strong>'
      +(minRec&&minRec.toko?' · '+esc(minRec.toko):'')+(minRec?' · '+fDate(minRec.tgl):'')
      +' — selisih '+fRp(h-min)+'/'+esc(satuan||'unit')+'</span>';
  }else if(hist.length>1){
    html+='<br><span style="color:var(--green)">'+ic('check-circle')+' Ini harga terendah dari '+hist.length+'× pembelian</span>';
  }
  return html;
}

function parseIdNum(s){return Number(String(s).trim().replace(/\./g,'').replace(',','.'));}
function parsePasteText(text){
  const lines=text.trim().split('\n').filter(l=>l.trim());
  const items=[],errors=[];
  lines.forEach((line,i)=>{
    const parts=line.split(',').map(p=>p.trim());
    if(parts.length<2){errors.push(`Baris ${i+1}: minimal "nama, jumlah"`);return;}
    const nama=parts[0],qty=parseIdNum(parts[1]),toko=parts[3]||'';
    let harga=parts[2]?parseIdNum(parts[2]):NaN;
    if(!nama){errors.push(`Baris ${i+1}: nama kosong`);return;}
    if(isNaN(qty)||qty<=0){errors.push(`Baris ${i+1}: jumlah tidak valid`);return;}
    // Harga kosong → ambil harga terakhir dari Master Barang [v1.34]
    const mb=S.masterBarang.find(x=>String(x.nama||'').trim().toLowerCase()===nama.toLowerCase());
    let auto=false;
    if((isNaN(harga)||harga<=0)&&mb&&Number(mb.hargaTerakhir)>0){harga=Number(mb.hargaTerakhir);auto=true;}
    if(isNaN(harga)||harga<=0){errors.push(`Baris ${i+1}: harga kosong & "${nama}" belum ada di katalog`);return;}

function setAbsRow(i,key,val){if(!S.absRows[i])S.absRows[i]={status:'',kodeProj:'',ket:'',jamLembur:0};if(key==='status'&&S.absRows[i].status===val){S.absRows[i].status='';S.absRows[i].jamLembur=0;go('absensi');return;}S.absRows[i][key]=val;if(key==='status')go('absensi');}

    </div>
    ${locked?'':`<div class="num-hint" style="margin-top:-4px">Upah dihitung ulang otomatis dari upah harian ${k?fRp(k.upahHarian):'karyawan'}</div>`}
    <div class="fg" style="margin-top:9px"><label class="fl">Keterangan</label>
      <input class="fc" id="ea-ket" value="${esc(a.ket||'')}"></div>
    <div class="act-row" style="margin-top:12px">
      <button class="btn btn-g btn-sm" onclick="closeModal()">Batal</button>
      <button class="btn btn-p btn-sm" style="flex:1" onclick="submitEditAbsensi()">${ic('save')} Simpan Perubahan</button>
    </div>`);
}
function submitEditAbsensi(){
  const idx=S.editAbsIdx,orig=S.editAbsOrig;
  if(idx==null||!orig){closeModal();return;}
  const a=S.logAbsensi[idx];if(!a){closeModal();return;}
  const locked=a.statusBayar==='Sudah Dibayar';
  const kodeProj=document.getElementById('ea-proj')?.value||'';
  const ket=document.getElementById('ea-ket')?.value||'';
  const tgl=locked?a.tgl:(document.getElementById('ea-tgl')?.value||a.tgl);
  const status=locked?a.status:(document.getElementById('ea-sts')?.value||a.status);
  const jamLembur=locked?(Number(a.jamLembur)||0):(parseFloat(document.getElementById('ea-lembur')?.value)||0);
  const k=S.karyawan.find(x=>x.id===a.idKaryawan);
  const upahH=k?Number(k.upahHarian)||0:0;
  const baseUpah=status==='Hadir'?upahH:status==='Setengah Hari'?upahH*0.5:0;
  const upahLembur=locked?(Number(a.upahLembur)||0):Math.round(jamLembur*upahH/8);
  const upahHariIni=locked?(Number(a.upahHariIni)||0):(baseUpah+upahLembur);
  // Cegah bentrok: absensi lain di tanggal & karyawan yang sama
  if(tgl!==a.tgl&&S.logAbsensi.some((x,i)=>i!==idx&&x.tgl===tgl&&x.idKaryawan===a.idKaryawan)){
    showToast('Sudah ada absensi '+esc(a.nama)+' di tanggal itu','err');return;
  }
  const namaProj=S.projects.find(p=>p.kode===kodeProj)?.nama||'';
  S.logAbsensi[idx]={...a,tgl,kodeProj,namaProj,status,jamLembur,upahLembur,upahHariIni,ket};
  ss(KS.abs,S.logAbsensi);
  closeModal();
  showToast('Absensi diupdate');
  go('absensi');
  doSync('updateAbsensi',{id:orig.id,oldTgl:orig.tgl,oldIdKaryawan:orig.idKaryawan,
    tgl,idKaryawan:a.idKaryawan,nama:a.nama,status,kodeProj,namaProj,
    upahHariIni,jamLembur,upahLembur,ket,locked});
}

async function delKasbon(idx){
  const k=S.logKasbon[idx];if(!k)return;
  if(k.noClosing&&k.noClosing.trim()!==''){showToast('Tidak bisa hapus -- terkait closing '+k.noClosing,'err');return;}
  if(!(await askConfirm('Hapus kasbon '+fRp(k.nominal)+' ('+k.tipe+') untuk '+k.nama+'?',{ok:'Hapus',danger:1})))return;
  S.logKasbon.splice(idx,1);ss(KS.ksb,S.logKasbon);showToast('Kasbon dihapus');go('kasbon');
  doSync('deleteKasbon',{id:k.id,tgl:k.tgl,idKaryawan:k.idKaryawan,tipe:k.tipe,nominal:k.nominal});
}
// ── CLOSING
let clsRekap=[],clsSel={};

// [v1.8] Helper: bandingkan tanggal sebagai string YYYY-MM-DD (aman timezone)
function dateInRange(tgl, dari, sampai){
  if(!tgl)return false;
  const d=typeof tgl==='string'?tgl.substring(0,10):tgl;
  return d>=dari&&d<=sampai;
}

// [v1.8] Ambil daftar closing unik dari logAbsensi
function getClosingList(){
  const map={};
  S.logAbsensi.forEach(a=>{
    if(!a.noClosing||a.noClosing.trim()==='')return;
    if(!map[a.noClosing]){
      map[a.noClosing]={noClosing:a.noClosing,tglBayar:a.tglBayar||'',karyawan:[],totalUpah:0,jmlRecord:0};
    }
    const c=map[a.noClosing];
    if(!c.karyawan.includes(a.idKaryawan))c.karyawan.push(a.idKaryawan);
    c.totalUpah+=Number(a.upahHariIni)||0;
    c.jmlRecord++;
  });
  return Object.values(map).sort((a,b)=>b.noClosing.localeCompare(a.noClosing));
}

function genClosing(){
  const dari=document.getElementById('cls-dari').value;
  const sampai=document.getElementById('cls-smp').value;
  if(!dari||!sampai){showToast('Pilih periode','err');return;}
  if(dari>sampai){showToast('Tanggal dari harus sebelum sampai','err');return;}
  // Gunakan string comparison — aman dari timezone issue
  clsRekap=S.karyawan.map(k=>{
    const abs=S.logAbsensi.filter(a=>
      a.idKaryawan===k.id &&
      a.statusBayar==='Belum Dibayar' &&
      dateInRange(a.tgl,dari,sampai)
    );
    if(!abs.length)return null;
    const tu=abs.reduce((s,a)=>s+(Number(a.upahHariIni)||0),0);
    const am=S.logKasbon.filter(x=>x.idKaryawan===k.id&&x.tipe==='AMBIL').reduce((s,x)=>s+(Number(x.nominal)||0),0);
    const pt=S.logKasbon.filter(x=>x.idKaryawan===k.id&&x.tipe==='POTONG').reduce((s,x)=>s+(Number(x.nominal)||0),0);
    const sisaKasbon=Math.max(0,am-pt);
    // Breakdown hari & lembur
    const hariHadir=abs.filter(a=>a.status==='Hadir').length;
    const hariSetengah=abs.filter(a=>a.status==='Setengah Hari').length;
    const jamLembur=abs.reduce((s,a)=>s+(Number(a.jamLembur)||0),0);
    const upahLembur=abs.reduce((s,a)=>s+(Number(a.upahLembur)||0),0);
    const upahPokok=tu-upahLembur;
    // Hitung proyek mayoritas (default proyek untuk bonus)
    const projCount={};abs.forEach(a=>{if(a.kodeProj)projCount[a.kodeProj]=(projCount[a.kodeProj]||0)+1;});
    const majorityProj=Object.keys(projCount).sort((a,b)=>projCount[b]-projCount[a])[0]||'';
    return{idKaryawan:k.id,nama:k.nama,hari:abs.length,hariHadir,hariSetengah,jamLembur,upahPokok,upahLembur,totalUpah:tu,sisaKasbon,kasbonDipotong:sisaKasbon,ksbProj:majorityProj,bonusAmount:0,bonusProj:majorityProj};
  }).filter(r=>r!==null);
  clsSel=Object.fromEntries(clsRekap.map(r=>[r.idKaryawan,true]));
  if(!clsRekap.length){showToast('Tidak ada absensi "Belum Dibayar" di periode ini','err');return;}
  showToast(''+clsRekap.length+' karyawan ditemukan');
  document.getElementById('cls-rekap').innerHTML=buildClsRekap();
}

function finalizeClosing(){
  const dari=document.getElementById('cls-dari').value;
  const sampai=document.getElementById('cls-smp').value;
  const tglBayar=document.getElementById('cls-bayar').value;
  const noC=document.getElementById('cls-noc').value.trim();
  if(!dari||!sampai||!tglBayar||!noC){showToast('Lengkapi semua data','err');return;}

  // Cek noClosing tidak duplikat
  const existing=getClosingList().find(c=>c.noClosing===noC);
  if(existing){showToast('No Closing "'+noC+'" sudah dipakai! Ganti nomor.','err');return;}

  const sIds=clsRekap.filter(r=>clsSel[r.idKaryawan]).map(r=>r.idKaryawan);
  if(!sIds.length){showToast('Pilih minimal 1 karyawan','err');return;}

  // Baca ulang nilai kasbon + bonus dari input (pastikan sinkron)
  clsRekap.forEach((r,i)=>{
    const ksbInp=document.getElementById('cls-ksb-'+i);
    if(ksbInp){r.kasbonDipotong=parseInt((ksbInp.value||'').replace(/[^0-9]/g,''))||0;}
    const bonInp=document.getElementById('cls-bon-'+i);
    if(bonInp){r.bonusAmount=parseInt((bonInp.value||'').replace(/[^0-9-]/g,''))||0;}
    const projSel=document.getElementById('cls-bonproj-'+i);
    if(projSel){r.bonusProj=projSel.value;}
    const ksbProjSel=document.getElementById('cls-ksbproj-'+i);
    if(ksbProjSel){r.ksbProj=ksbProjSel.value;}
  });

  let updated=0;
  // Update status absensi — gunakan string comparison (fix bug timezone)
  S.logAbsensi=S.logAbsensi.map(a=>{
    if(!sIds.includes(a.idKaryawan))return a;
    if(a.statusBayar!=='Belum Dibayar')return a;
    if(!dateInRange(a.tgl,dari,sampai))return a;
    updated++;
    return{...a,statusBayar:'Sudah Dibayar',noClosing:noC,tglBayar};
  });
  ss(KS.abs,S.logAbsensi);

  // Tambah POTONG kasbon
  const ksbItems=clsRekap.filter(r=>clsSel[r.idKaryawan]&&Number(r.kasbonDipotong)>0);
  ksbItems.forEach(r=>{
    S.logKasbon.push({
      id:'KSB-CLO-'+Date.now()+'-'+r.idKaryawan,
      tgl:tglBayar,idKaryawan:r.idKaryawan,nama:r.nama,
      tipe:'POTONG',nominal:Number(r.kasbonDipotong),kodeProj:r.ksbProj||'',
      noClosing:noC,ket:'Potong kasbon — '+noC+(r.ksbProj?' → '+(S.projects.find(p=>p.kode===r.ksbProj)?.nama||r.ksbProj):'')
    });
  });

  // Tambah BONUS kasbon
  const bonusItems=clsRekap.filter(r=>clsSel[r.idKaryawan]&&Number(r.bonusAmount)!==0);
  bonusItems.forEach(r=>{
    S.logKasbon.push({
      id:'KSB-BON-'+Date.now()+'-'+r.idKaryawan,
      tgl:tglBayar,idKaryawan:r.idKaryawan,nama:r.nama,
      tipe:'BONUS',nominal:Number(r.bonusAmount),kodeProj:r.bonusProj||'',
      noClosing:noC,ket:'Bonus — '+noC+(r.bonusProj?' · '+r.bonusProj:'')
    });
  });
  ss(KS.ksb,S.logKasbon);

  showToast('Closing '+noC+' selesai — '+updated+' absensi diupdate');
  doSync('finalizeClosing',{
    dari,sampai,tglBayar,noClosing:noC,
    selectedIds:sIds,
    kasbonItems:ksbItems.map(r=>({idKaryawan:r.idKaryawan,nama:r.nama||'',nominal:Number(r.kasbonDipotong),kodeProj:r.ksbProj||''})),
    bonusItems:bonusItems.map(r=>({idKaryawan:r.idKaryawan,nama:r.nama||'',nominal:Number(r.bonusAmount),kodeProj:r.bonusProj||''}))
  });
  clsRekap=[];clsSel={};
  setTab('closing','log');
}

// [v1.8] Hapus / batalkan closing
async function confirmDeleteClosing(noClosing){
  const list=getClosingList();
  const c=list.find(x=>x.noClosing===noClosing);
  if(!c)return;
  if(!(await askConfirm('BATALKAN CLOSING "'+noClosing+'"?\n\nIni akan:\n• Reset '+c.jmlRecord+' absensi kembali ke "Belum Dibayar"\n• Hapus kasbon POTONG terkait closing ini\n\nLanjutkan?',{ok:'Batalkan closing',danger:1})))return;
  deleteClosing(noClosing);
}

function deleteClosing(noClosing){
  let resetCount=0;
  // Reset status absensi
  S.logAbsensi=S.logAbsensi.map(a=>{
    if(a.noClosing!==noClosing)return a;
    resetCount++;
    return{...a,statusBayar:'Belum Dibayar',noClosing:'',tglBayar:''};
  });
  ss(KS.abs,S.logAbsensi);

  // Hapus kasbon POTONG & BONUS terkait closing ini
  const before=S.logKasbon.length;
  S.logKasbon=S.logKasbon.filter(k=>k.noClosing!==noClosing||(k.tipe!=='POTONG'&&k.tipe!=='BONUS'));
  ss(KS.ksb,S.logKasbon);
  const removedKsb=before-S.logKasbon.length;

  showToast('Closing "'+noClosing+'" dibatalkan — '+resetCount+' absensi direset, '+removedKsb+' kasbon dihapus');
  doSync('deleteClosing',{noClosing});
  go('closing');
}

function submitPay(){

function loadRabForProj(kodeProj){
  S.rabKodeProj=kodeProj;

  S.rabNominal=ex?{material:ex.material||0,upah:ex.upah||0,subkon:ex.subkon||0,overhead:ex.overhead||0}:{material:0,upah:0,subkon:0,overhead:0};
  S.rabLabels=ex?{mat:ex.labelMat||'',upah:ex.labelUpah||'',subkon:ex.labelSubkon||'',overhead:ex.labelOverhead||''}:{mat:'',upah:'',subkon:'',overhead:''};
  if(ex)showToast('RAB dimuat','info');
  go('rab');

function saveRAB(){
  if(!S.rabKodeProj){showToast('Pilih proyek dulu','err');return;}
  // Baca label langsung dari DOM (paling akurat) lalu update state
  const lm=document.getElementById('rab-lbl-mat')?.value??S.rabLabels.mat??'';
  const lu=document.getElementById('rab-lbl-upah')?.value??S.rabLabels.upah??'';
  const ls=document.getElementById('rab-lbl-sub')?.value??S.rabLabels.subkon??'';
  const lo=document.getElementById('rab-lbl-ovh')?.value??S.rabLabels.overhead??'';
  S.rabLabels={mat:lm,upah:lu,subkon:ls,overhead:lo};
  const nom=S.rabNominal;
  const total=(Number(nom.material)||0)+(Number(nom.upah)||0)+(Number(nom.subkon)||0)+(Number(nom.overhead)||0);
  if(!total){showToast('Isi minimal satu angka','err');return;}
  const rabData={kodeProj:S.rabKodeProj,tglUpdate:today(),material:Number(nom.material)||0,upah:Number(nom.upah)||0,subkon:Number(nom.subkon)||0,overhead:Number(nom.overhead)||0,labelMat:lm,labelUpah:lu,labelSubkon:ls,labelOverhead:lo};
  const idx=S.rab.findIndex(r=>r.kodeProj===S.rabKodeProj);
  if(idx>=0)S.rab[idx]=rabData;else S.rab.push(rabData);
  ss(KS.rab,S.rab);showToast('RAB disimpan');go('rab');
  doSync('saveRAB',rabData);
}
async function deleteRAB(){
  if(!S.rabKodeProj)return;
  const proj=S.projects.find(p=>p.kode===S.rabKodeProj);
  const namaProj=proj?.nama||S.rabKodeProj;
  if(!(await askConfirm('Hapus RAB untuk "'+namaProj+'"?\nData anggaran akan dihapus permanen.',{ok:'Hapus RAB',danger:1})))return;
  const kodeProj=S.rabKodeProj;
  S.rab=S.rab.filter(r=>r.kodeProj!==kodeProj);
  S.rabNominal={material:0,upah:0,subkon:0,overhead:0};
  S.rabLabels={mat:'',upah:'',subkon:'',overhead:''};

        </div></div>

    </div>`;
  };
  return `<div class="card" style="margin-bottom:10px">
    <div class="fg" style="margin-bottom:0"><label class="fl">Pilih Proyek</label><select class="fc" onchange="S.rabKodeProj=this.value;go('rab')">${prjOpts}</select></div></div>
  <div class="card" style="margin-bottom:10px">
    <div class="row" style="margin-bottom:8px"><div class="item-name">${esc(proj?.nama||S.rabKodeProj)}</div><span style="font-size:10px;color:var(--text3)">RAB: ${fDate(rab.tglUpdate)}</span></div>
    <div class="g3">

  ${rowComp(rab.labelUpah||'Upah Tenaga',''+ic('user')+'',rab.upah||0,realUpah)}
  ${rowComp(rab.labelSubkon||'Subkontraktor',''+ic('hammer')+'',rab.subkon||0,realSub)}

      <div class="chip" style="background:${realT>rabT?'var(--ic-red)':'var(--ic-green)'}">
        <div class="chip-lbl">Total Realisasi</div>
        <div class="chip-val" style="color:${realT>rabT?'var(--red)':'var(--green)'}">${fRp(realT)}</div>
      </div></div>
    ${rabT>0?`<div class="prog-bar" style="margin-top:10px"><div class="prog-fill" style="width:${Math.min(100,Math.round(realT/rabT*100))}%;background:${realT>rabT?'var(--red)':'var(--green)'}"></div></div>
    <div style="font-size:12px;margin-top:6px"><span style="color:var(--text2)">Selisih: </span>

    const ri=S.logSubkon.findIndex(x=>x.id===ls.id);

    return `<div class="card">
      <div class="row" style="margin-bottom:8px">

          <div style="font-weight:700;font-size:13px">${fRp(ls.nilaiKontrak)}</div>

function saveBayarSubkon(idx){
  const cash=getNum('sb-nom')||0;const pot=getNum('sb-pot')||0;
  const nom=cash+pot; // total settlement = cash + potongan kasbon
  const tgl=document.getElementById('sb-tgl').value;
  const fotoEl=document.getElementById('sb-foto');
  const fotoFile=(fotoEl&&fotoEl.files&&fotoEl.files[0])?fotoEl.files[0]:null;
  if(nom<=0){showToast('Masukkan nominal pembayaran atau potongan','err');return;}
  if(pot>0&&(!document.getElementById('sb-kar')||!document.getElementById('sb-kar').value)){
    showToast('Pilih karyawan yang dipotong kasbonnya','err');return;}
  const ls=S.logSubkon[idx];
  const totalBayar=(ls.nominalBayar||0)+nom;
  const sisa=ls.nilaiKontrak-totalBayar;
  const sts=sisa<=0?'Lunas':totalBayar>0?'DP':'Belum Dibayar';
  // Update logSubkon state
  S.logSubkon[idx].nominalBayar=totalBayar;
  S.logSubkon[idx].statusBayar=sts;
  S.logSubkon[idx].tglBayar=tgl;
  if(pot>0) S.logSubkon[idx].potongan=(S.logSubkon[idx].potongan||0)+pot;
  // Riwayat bayar (simpan breakdown)
  if(!S.riwayatBayarSubkon[ls.id])S.riwayatBayarSubkon[ls.id]=[];
  const riwEntry={tgl,nominal:nom};
  if(pot>0)riwEntry.potongan=pot;
  S.riwayatBayarSubkon[ls.id].push(riwEntry);
  ss(KS.rbsk,S.riwayatBayarSubkon);
  ss(KS.lsk,S.logSubkon);
  // Jika ada potongan kasbon, tambah entri POTONG ke logKasbon (client-side)
  let idKar='',namaKar='',ketPot='',potId='';
  if(pot>0){
    const sel=document.getElementById('sb-kar');
    if(sel&&sel.value){
      idKar=sel.value;
      namaKar=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].text.split(' (hutang')[0]:'';
    }
    ketPot='Dipotong dari bayar subkon '+(ls.kodeProj||'');
    if(idKar){
      potId='KSB-POT-'+Date.now();
      S.logKasbon.push({
        id:potId,tgl,
        idKaryawan:idKar,tipe:'POTONG',nominal:pot,
        nama:namaKar,noClosing:'',ket:ketPot,kodeProj:ls.kodeProj||'',pending:true
      });
      ss(KS.ksb,S.logKasbon);
    }
  }
  closeModal();
  showToast(sts==='Lunas'?'Lunas! Pembayaran selesai':'Pembayaran dicatat · Sisa: '+fRp(Math.max(0,sisa)));
  go('subkon');
  doSync('updateLogSubkon',{
    id:ls.id,kodeProj:ls.kodeProj,uraian:ls.uraian,
    nominalBayar:totalBayar,statusBayar:sts,tglBayar:tgl,
    potongan:pot>0?pot:0,
    idKaryawanPotong:idKar,
    namaKaryawanPotong:namaKar,
    ketPotongan:ketPot,
    potId:potId
  });
  if(fotoFile)uploadBuktiSubkon(ls.id,fotoFile);
}
async function uploadBuktiSubkon(idLog,file){
  try{
    showToast('Mengupload bukti transfer…','info');
    const b64=await compressImage(file);
    const d=await gsPost('uploadBuktiSubkon',{idLog,b64,mime:'image/jpeg',filename:'bukti-'+idLog+'-'+Date.now()+'.jpg'});
    if(d)applyGS(d);
    showToast('Bukti tersimpan di Google Drive');
    go(S.page);
  }catch(e){
    showToast('Upload bukti gagal: '+e.message+' — pembayaran tetap tercatat','err');
  }
}

                    <div style="margin-top:6px;background:var(--ic-blue);border-radius:8px;padding:8px">
                      ${rw.map((r,ri)=>`<div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 0${ri<rw.length-1?';border-bottom:1px dashed var(--bd-blue)':''}">
                        <span style="color:var(--text2)">${ic('calendar')} ${fDate(r.tgl)}</span>
                        <span style="font-weight:700;color:var(--green)">+${fRp(r.nominal)}</span>

                      <div style="display:flex;justify-content:space-between;font-size:11px;padding:5px 0 0;border-top:1px solid var(--bd-blue);margin-top:2px">
                        <span style="color:var(--blue);font-weight:600">Total dibayar</span>
                        <span style="font-weight:700;color:var(--blue)">${fRp(ls.nominalBayar||0)}</span>
                      </div>
                    </div></details>`
                  :ls.nominalBayar>0
                    ?`<div style="font-size:11px;color:var(--text2);margin-top:5px">${ic('cash')} Dibayar: <strong style="color:var(--green)">${fRp(ls.nominalBayar)}</strong>${ls.tglBayar?' · '+fDate(ls.tglBayar):''}</div>`
                    :'';
                return `<div class="sub-card" style="margin-bottom:6px">
                  <div class="row">
                    <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600">${esc(ls.uraian)}</div>
                      <div class="item-sub">${ic('calendar')} ${fDate(ls.tgl)}</div></div>
                    <div style="text-align:right;flex-shrink:0;margin-left:8px">
                      <div style="font-size:12px;font-weight:700">${fRp(ls.nilaiKontrak)}</div>
                      ${bdg(ls.statusBayar)}
                    </div>
                  </div>
                  ${cicilan}
                </div>`;
              }).join('')}
            </div>
          </details>`;
        }).join('');
      })()}
    </div>`;
  }).filter(Boolean).join('');
  return header+(rows||'<div class="empty">Belum ada pekerjaan subkon</div>');
}

// Lazy-load SheetJS dari CDN (cache oleh browser setelah load pertama)
let _xlsxLoaded=false;
function _loadXlsx(){
  return new Promise((res,rej)=>{
    if(_xlsxLoaded||window.XLSX){_xlsxLoaded=true;res();return;}
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
    s.onload=()=>{_xlsxLoaded=true;res();};
    s.onerror=()=>rej(new Error('Gagal memuat library Excel. Pastikan ada koneksi internet saat pertama kali export.'));
    document.head.appendChild(s);
  });
}
function _dlFile(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
}
const fNum=v=>Number(v)||0;

// ── Excel style palette (xlsx-js-style) ────────────────────────────────
const _ST={
  title: {font:{bold:true,sz:13,color:{rgb:'FFFFFF'}},fill:{patternType:'solid',fgColor:{rgb:'1F4E79'}},alignment:{horizontal:'center',vertical:'center'}},
  info:  {font:{sz:9,italic:true,color:{rgb:'595959'}},fill:{patternType:'solid',fgColor:{rgb:'D6DCE4'}},alignment:{horizontal:'left',vertical:'center'}},
  hdr:   {font:{bold:true,sz:10,color:{rgb:'FFFFFF'}},fill:{patternType:'solid',fgColor:{rgb:'2E75B6'}},alignment:{horizontal:'center',vertical:'center'}},
  hdrR:  {font:{bold:true,sz:10,color:{rgb:'FFFFFF'}},fill:{patternType:'solid',fgColor:{rgb:'2E75B6'}},alignment:{horizontal:'right',vertical:'center'}},
  le:    {fill:{patternType:'solid',fgColor:{rgb:'DEEAF1'}},alignment:{horizontal:'left'}},
  lo:    {fill:{patternType:'solid',fgColor:{rgb:'FFFFFF'}},alignment:{horizontal:'left'}},
  ce:    {fill:{patternType:'solid',fgColor:{rgb:'DEEAF1'}},alignment:{horizontal:'center'}},
  co:    {fill:{patternType:'solid',fgColor:{rgb:'FFFFFF'}},alignment:{horizontal:'center'}},
  ne:    {numFmt:'#,##0',fill:{patternType:'solid',fgColor:{rgb:'DEEAF1'}},alignment:{horizontal:'right'}},
  no:    {numFmt:'#,##0',fill:{patternType:'solid',fgColor:{rgb:'FFFFFF'}},alignment:{horizontal:'right'}},
  lbl:   {font:{bold:true,sz:10},fill:{patternType:'solid',fgColor:{rgb:'D6DCE4'}},alignment:{horizontal:'left'}},
  val:   {font:{bold:true,sz:10},numFmt:'#,##0',fill:{patternType:'solid',fgColor:{rgb:'D6DCE4'}},alignment:{horizontal:'right'}},
  lunas: {font:{bold:true,color:{rgb:'1B5E20'}},fill:{patternType:'solid',fgColor:{rgb:'E8F5E9'}},alignment:{horizontal:'center'}},
  belum: {font:{bold:true,color:{rgb:'E65100'}},fill:{patternType:'solid',fgColor:{rgb:'FFF3E0'}},alignment:{horizontal:'center'}},
  jalan: {font:{bold:true,color:{rgb:'0D47A1'}},fill:{patternType:'solid',fgColor:{rgb:'E3F2FD'}},alignment:{horizontal:'center'}},
  hold:  {font:{bold:true,color:{rgb:'5D4037'}},fill:{patternType:'solid',fgColor:{rgb:'EFEBE9'}},alignment:{horizontal:'center'}},
  batal: {font:{bold:true,color:{rgb:'B71C1C'}},fill:{patternType:'solid',fgColor:{rgb:'FFEBEE'}},alignment:{horizontal:'center'}},
  netPos:{font:{bold:true,sz:11,color:{rgb:'1B5E20'}},numFmt:'#,##0',fill:{patternType:'solid',fgColor:{rgb:'E8F5E9'}},alignment:{horizontal:'right'}},
  netNeg:{font:{bold:true,sz:11,color:{rgb:'B71C1C'}},numFmt:'#,##0',fill:{patternType:'solid',fgColor:{rgb:'FFEBEE'}},alignment:{horizontal:'right'}},
  pos:(e)=>({numFmt:'#,##0',font:{color:{rgb:'1B5E20'}},fill:{patternType:'solid',fgColor:{rgb:e?'DEEAF1':'FFFFFF'}},alignment:{horizontal:'right'}}),
  neg:(e)=>({numFmt:'#,##0',font:{color:{rgb:'B71C1C'}},fill:{patternType:'solid',fgColor:{rgb:e?'DEEAF1':'FFFFFF'}},alignment:{horizontal:'right'}}),
  pct:(e)=>({numFmt:'0.0',fill:{patternType:'solid',fgColor:{rgb:e?'DEEAF1':'FFFFFF'}},alignment:{horizontal:'center'}}),
  sts:(s)=>s==='Selesai'?_ST.lunas:s==='Berjalan'?_ST.jalan:s==='Hold'?_ST.hold:_ST.batal,
  tipe:(t)=>t==='BONUS'?_ST.lunas:t==='POTONG'?_ST.belum:_ST.jalan,
};
function _C(v,s){if(v===null||v===undefined)return{v:'',t:'z',s:s||{}};return{v,t:typeof v==='number'?'n':'s',s:s||{}};}
function _eRow(n){return Array.from({length:n},()=>_C(''));}
function _makeWS(rows,colW,merges){
  const ws={};
  rows.forEach((row,r)=>(row||[]).forEach((cell,c)=>{const ref=XLSX.utils.encode_cell({r,c});ws[ref]=(cell&&typeof cell==='object'&&'t'in cell)?cell:_C(cell);}));
  const lastR=rows.length-1,lastC=Math.max(0,...rows.map(r=>(r||[]).length-1));
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:lastR,c:lastC}});
  if(colW)ws['!cols']=colW.map(w=>({wch:w}));
  if(merges)ws['!merges']=merges;
  return ws;
}

    const vs=vSum(p);
    const mat=S.pembelian.filter(b=>b.kodeProj===p.kode&&b.status!=='ASET').reduce((s,b)=>s+calcTotal(b),0);
    const upah=S.logAbsensi.filter(a=>a.kodeProj===p.kode).reduce((s,a)=>s+(Number(a.upahHariIni)||0),0);
    const subkon=S.logSubkon.filter(ls=>ls.kodeProj===p.kode).reduce((s,ls)=>s+(Number(ls.nilaiKontrak)||0),0);
    const kb=calcKasbonForProj(p.kode);

    const laba=vs.final-totalBiaya;
    const bayar=S.logPembayaran.filter(b=>b.kodeProj===p.kode).reduce((s,b)=>s+(Number(b.nominal)||0),0);
    return{i:i+1,p,vs,mat,upah,subkon,kb,totalBiaya,laba,bayar,piutang:vs.final-bayar,

  const avgMargin=sumNk?parseFloat((sumLaba/sumNk*100).toFixed(1)):0;

  const HDR=['No','Kode','Nama Proyek','Jenis','Status',

  const mainRows=[

    _eRow(19),
    HDR.map((h,i)=>_C(h,i>=5&&i<=17?_ST.hdrR:_ST.hdr)),
    // Data rows
    ...data.map((d,ri)=>{
      const e=ri%2===0;
      return[
        _C(d.i,e?_ST.ce:_ST.co),
        _C(d.p.kode,e?_ST.ce:_ST.co),
        _C(d.p.nama,e?_ST.le:_ST.lo),
        _C(d.p.jenis||'-',e?_ST.ce:_ST.co),

        _C(fNum(d.p.nilaiKontrak),e?_ST.ne:_ST.no),
        _C(fNum(d.vs.final),e?_ST.ne:_ST.no),
        _C(d.mat,e?_ST.ne:_ST.no),
        _C(d.upah,e?_ST.ne:_ST.no),
        _C(d.subkon,e?_ST.ne:_ST.no),
        _C(d.kb.bonus,e?_ST.ne:_ST.no),
        _C(d.totalBiaya,e?_ST.ne:_ST.no),
        _C(d.laba,d.laba>=0?_ST.pos(e):_ST.neg(e)),
        _C(d.margin,_ST.pct(e)),
        _C(fNum(d.p.progress),_ST.pct(e)),
        _C(d.p.tglMulai||'-',e?_ST.ce:_ST.co),
        _C(d.bayar,e?_ST.ne:_ST.no),

        _C(d.p.catatan||'',e?_ST.le:_ST.lo),
